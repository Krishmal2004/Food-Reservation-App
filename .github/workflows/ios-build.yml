name: iOS Build

on:
  push:
    branches: [ "tech" ]
  pull_request:
    branches: [ "tech" ]

jobs:
  build:
    name: Build iOS App
    # iOS builds must run on a macOS environment
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use the Node version required for your project

      - name: Install npm dependencies
        run: npm install
        # If you use yarn, use: yarn install

      - name: Install CocoaPods
        run: cd ios && pod install
        # This step assumes your Xcode project is in the 'ios' folder

      - name: Build iOS App
        run: |
          cd ios
          xcodebuild -workspace Food_Delivery_App.xcworkspace \
            -scheme Food_Delivery_App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            build
        # Replace 'YourAppName' with your actual workspace and scheme names
